<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta
      name="description"
      itemprop="about"
      content="{{config.description}}"
    />
    <link rel="stylesheet" href="{{ get_url(path='styles.css') | safe }}" />
  </head>

  <body>
    <div class="wrapper">
      <header>
        <a href="{{ get_url(path='/') | safe }}">
          <img
            src="{{ get_url(path='img/logo.png') | safe }}"
            class="site-logo"
            alt="Logo"
            width="275px"
            height="auto"
        /></a>

        <p>{{ config.description }}</p>

        <p class="view"
          ><a href="https://furigam.com" target="_blank"
            >View my game studio.
            <small>furigam.com</small></a
          ></p
        >

        <p class="view"
          ><a href="https://github.com/harperbolic/" target="_blank"
            >View my profile on GitHub. <small>harperbolic</small></a
          ></p
        >

        <ul class="downloads">
          <li
            ><a href="https://harperbolic.itch.io" target="_blank">Itch.io <strong>Games</strong></a></li
          >
          <li
            ><a href="mailto:hello@harper.rocks" target="_blank">Get in touch!<strong>Email</strong></a></li
          >
          <li
            ><a href="https://bsky.app/profile/harpermoreira.com" target="_blank">Microblog <strong>BlueSky</strong></a></li
          >
        </ul>
      </header>

      <section> {% block content %} {% endblock content %} </section>

      <footer>
        <p
          ><small>
            Powered by <a href="https//www.getzola.org/" target="_blank">Zola</a> &mdash; Themed
            with
            <a href="https://github.com/semanticdata/zola-minimal/" target="_blank">Minimal</a
            >
          </small></p
        >
      </footer>
    </div>
  </body>
</html>
